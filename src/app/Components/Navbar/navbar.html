<nav class="navbar-pokemon">

    <div class="navbar-content">

        <a class="navbar-logo" routerLink="/" (click)="fecharMenu()">
            <span class="logo-pokeball"></span>

            <span>Pokédex</span>
        </a>


        <!-- ==========================================
             MENU DESKTOP
             ========================================== -->

        <div class="navbar-links navbar-links-desktop">

            @for (item of itens; track item.titulo) {

            <a class="navbar-link" [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{
                        exact: item.link === '/pokedex'
                    }">
                {{ item.titulo }}
            </a>

            }

        </div>


        <!-- ==========================================
             BOTÃO MOBILE
             ========================================== -->

        <button type="button" class="navbar-menu-button" (click)="alternarMenu()" [attr.aria-expanded]="menuAberto()"
            aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>


    <!-- ==============================================
         DROPDOWN MOBILE
         ============================================== -->

    @if (menuAberto()) {

    <div class="navbar-dropdown">

        <div class="navbar-dropdown-grid">

            @for (item of itens; track item.titulo) {

            <a class="navbar-dropdown-link" [routerLink]="item.link" routerLinkActive="active"
                [routerLinkActiveOptions]="{
                        exact: item.link === '/pokedex'
                    }" (click)="fecharMenu()">
                <span>▶</span>

                {{ item.titulo }}
            </a>

            }

        </div>

    </div>

    }
